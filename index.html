<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Noelia</title>

  <style>
    body{
      background-color: pink;
      text-align: center;
      font-family: Arial;
      margin-top: 100px;
    }

    h1{
      color: white;
      font-size: 50px;
    }

    p{
      color: white;
      font-size: 25px;
    }

    button{
      padding: 10px 20px;
      border: none;
      background: white;
      color: hotpink;
      font-size: 18px;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover{
      background: lightpink;
    }.fondo span{
  position:absolute;
  color:rgba(255,255,255,0.5);
  font-size:30px;
  animation: flotar linear infinite;
  bottom:-100px;
}

@keyframes flotar{
  from{
    transform:translateY(0) rotate(0deg);
  }

  to{
    transform:translateY(-120vh) rotate(360deg);
  }
}
  </style>
</head>

<body>
<div class="fondo">
  <span style="left:10%; animation-duration:8s;">❤️</span>
  <span style="left:30%; animation-duration:12s;">💕</span>
  <span style="left:50%; animation-duration:10s;">💖</span>
  <span style="left:70%; animation-duration:14s;">❤️</span>
  <span style="left:90%; animation-duration:9s;">💘</span>
</div>

  <h1>Noelia ❤️</h1>

  <p>te quiero mucho</p>

  <button onclick="saludo()">
    pulsa aqui o moriras
  </button>

  <script>
    function saludo(){
      alert("noelia culo rico y delicioso 😎");
    }
  </script>

</body>
</html>
